<form (ngSubmit)="onSubmit(titleInput.value, textarea.value)">
  <app-control label="Title">
    <input name="title" id="title" type="text" #titleInput>
  </app-control>
  <app-control label="Request">
    <textarea name="request" id="request" rows="3" #textarea></textarea>
  </app-control>

  <p>
    <button appButton>
      Submit
      <span ngProjectAs="icon">✉</span>
    </button>
  </p>
</form>
