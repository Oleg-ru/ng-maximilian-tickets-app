<form (ngSubmit)="onSubmit()" #form>
  <app-control label="Title">
    <input name="title" id="title" type="text" [(ngModel)]="titleInput" #input>
  </app-control>
  <app-control label="Request">
    <textarea name="request" id="request" rows="3" [(ngModel)]="textarea" #input></textarea>
  </app-control>

  <p>
    <button appButton>
      Submit
      <span ngProjectAs="icon">✉</span>
    </button>
  </p>
</form>
